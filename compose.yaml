# Local development stack: `docker compose up --build`.
# The credentials below are for the local database only; real environments supply
# ConnectionStrings__Pfm from their secret store.
name: pfm

x-environment: &environment
  # The local stack runs over plain HTTP; Development relaxes cookies to match (see CookiePolicy).
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Pfm: Host=db;Port=5432;Database=pfm;Username=pfm;Password=pfm
  # Links in emails point at the SPA's dev server.
  App__PublicUrl: http://localhost:5173
  # Every email lands in Mailpit: http://localhost:8025
  Smtp__Host: mailpit
  Smtp__Port: "1025"
  Smtp__UseStartTls: "false"
  # Logs, traces and metrics go to the Aspire Dashboard: http://localhost:18888
  OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
  # Attachments go to the storage emulator. The API reaches it by its service name; a signed URL is opened
  # by the browser, which reaches it on localhost.
  Storage__ServiceUrl: http://storage:7070
  Storage__PublicUrl: http://localhost:7070
  Storage__Bucket: pfm-attachments
  Storage__AccessKey: pfm
  Storage__SecretKey: pfm-local-secret

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pfm
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm -d pfm"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # Private object storage for attachments: the Versity S3 Gateway, which speaks the S3 API over a folder.
  # Local only; a real environment names its own bucket in Storage__*.
  storage:
    image: versity/versitygw:v1.11.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: pfm
      ROOT_SECRET_KEY: pfm-local-secret
    ports:
      - "7070:7070"
    volumes:
      # Each folder under /data is a bucket, so this volume is the bucket pfm-attachments.
      - attachments:/data/pfm-attachments

  # Shows the logs, traces and metrics the API and worker send over OTLP. Local only: no sign-in.
  # The API run from source sends to its OTLP port on localhost:4317.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  # Applies database migrations, then exits. The API and worker wait for it.
  migrate:
    build: .
    image: pfm-api
    command: ["migrate"]
    environment: *environment
    depends_on:
      db:
        condition: service_healthy

  # Published directly: nothing here puts it behind a proxy, so ASPNETCORE_FORWARDEDHEADERS_ENABLED stays unset
  # and X-Forwarded-For is not believed. A deployment that serves it only through the SPA's nginx image sets it
  # on the API there, with the API reachable from that proxy alone (see "Rate limiting" in the README).
  api:
    build: .
    image: pfm-api
    environment: *environment
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      dashboard:
        condition: service_started
      storage:
        condition: service_started

  worker:
    build:
      context: .
      args:
        PROJECT: Pfm.Worker
    image: pfm-worker
    environment: *environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      dashboard:
        condition: service_started

volumes:
  db-data:
  attachments:
